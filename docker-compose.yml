services:
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command: redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false
    ports: ["9092:9092", "9644:9644"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: stream, POSTGRES_PASSWORD: stream, POSTGRES_DB: events}
    ports: ["5432:5432"]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    depends_on: [postgres]
  processor:
    build: .
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      DATABASE_URL: postgresql://stream:stream@postgres:5432/events
    depends_on: [redpanda, postgres]
    command: python processor/processor.py
